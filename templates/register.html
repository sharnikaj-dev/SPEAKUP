{% extends 'base.html' %}

{% block title %}Create Account - SPEAKUP{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🚀</span>
            <h2 class="auth-title">Join SPEAKUP</h2>
            <p class="auth-subtitle">Create an account to start practicing English conversations</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form" novalidate>
            <div class="form-group">
                <label for="name" class="form-label">Full Name</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    class="form-control" 
                    placeholder="e.g. John Doe"
                    value="{{ name|default('') }}" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="name@example.com"
                    value="{{ email|default('') }}" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="At least 6 characters"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    class="form-control" 
                    placeholder="Repeat your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}" class="link-teal">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
