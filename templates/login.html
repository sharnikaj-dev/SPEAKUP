{% extends 'base.html' %}

{% block title %}Log In - SPEAKUP{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🔑</span>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Log in to continue your English practice</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form" novalidate>
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    class="form-control" 
                    placeholder="name@example.com"
                    value="{{ email|default('') }}" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account yet? <a href="{{ url_for('auth.register') }}" class="link-teal">Register now</a></p>
        </div>
    </div>
</div>
{% endblock %}
